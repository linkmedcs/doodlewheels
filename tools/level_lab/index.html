<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DoodleBike · 关卡实验室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2eedf;color:#263c36;font:14px system-ui}header{background:#213f38;color:white;padding:17px 24px;display:flex;gap:22px;align-items:center}h1{font-size:20px;margin:0}header span{font-size:12px;opacity:.75}main{display:grid;grid-template-columns:260px 1fr;height:calc(100dvh - 62px)}aside{padding:20px;overflow:auto;border-right:1px solid #d1cab9}select,button{font:inherit;padding:9px;border:1px solid #b7c4b4;border-radius:6px;background:#fff;color:#234638;cursor:pointer}select{width:100%;margin:8px 0 12px}button:hover{background:#deebdc}.row{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}h2{font-size:16px;margin:12px 0}p,small{line-height:1.8}small{font-size:12px;color:#6d7466}#view{position:relative;min-width:0;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:14px;left:14px;background:#fffdf2ed;padding:9px 12px;border-radius:6px;pointer-events:none}#controls{position:absolute;bottom:20px;left:20px;display:flex;gap:14px}#controls button{font-size:25px;width:64px;height:52px;touch-action:none;user-select:none}#error{color:#a53630}#warnings{color:#92712f;font-size:12px}label{display:block}hr{border:0;border-top:1px solid #d1cab9;margin:18px 0}@media(max-width:700px){header span{display:none}main{grid-template-columns:190px 1fr}aside{padding:12px}#hud{font-size:12px}}
</style><header><h1>DoodleBike / 关卡实验室</h1><span>全部 60 关 · 原游戏素材 · 本地预览与近似试玩</span></header>
<main><aside><label for="level">选择关卡（1～60）</label><select id="level"></select><div class="row"><button id="prev">上一关</button><button id="next">下一关</button></div><h2 id="title"></h2><small>直接读取当前工程地图，重置后重新载入。</small><div class="row" style="margin-top:14px"><button id="play">开始试玩</button><button id="reset">重置 R</button><button id="single">单步</button></div><div class="row"><button id="fit">地图总览</button><button id="follow">跟随车辆</button></div><p>← / A 向左 · → / D 向右<br>空格 暂停 / 继续 · R 重置<br>滚轮缩放 · 拖动平移</p><label><input id="textures" type="checkbox" checked>使用原游戏素材</label><p id="warnings"></p><p id="error"></p><hr><small>这是 Box2D 近似模拟。开关按距离触发，复杂机关的近似方式会在上方标明。原版 Lua 用于初始化和开关动作；渲染、物理与原生游戏可能存在差异，实际通关以手机为准。</small></aside><section id="view"><canvas id="canvas" tabindex="0" aria-label="关卡地图与试玩画面"></canvas><div id="hud">加载中…</div><div id="controls"><button id="left">←</button><button id="right">→</button></div></section></main>
<script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),img=new Image();img.src='/entity.png';
let state=null,session=null,atlas={},catalog=[],playing=false,following=false,zoom=.4,cx=0,cy=0,keys=new Set(),touch=0,busy=false,loading=false,last=0,acc=0,drag=null;
async function api(path,data){let r=await fetch('/api/'+path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{}),d=await r.json();if(!r.ok)throw Error(d.error);return d}
function pause(){playing=false;keys.clear();touch=0;acc=0;$('play').textContent='继续试玩'}
async function load(){if(loading)return;loading=true;pause();$('error').textContent='';try{while(busy)await new Promise(r=>setTimeout(r,10));let n=+$('level').value;state=await api('load',{level:n});session=state.session;$('title').textContent=n+' · '+catalog.find(x=>x.level===n).title;following=false;fit();$('play').textContent='开始试玩';$('prev').disabled=n===1;$('next').disabled=n===60}catch(e){$('error').textContent=e.message}finally{loading=false}}
function fit(){if(!state)return;let a=state.objects.filter(o=>o.kind!=='label'),xmin=Math.min(...a.map(o=>o.x-Math.hypot(o.w,o.h)/2)),xmax=Math.max(...a.map(o=>o.x+Math.hypot(o.w,o.h)/2)),ymin=Math.min(...a.map(o=>o.y-Math.hypot(o.w,o.h)/2)),ymax=Math.max(...a.map(o=>o.y+Math.hypot(o.w,o.h)/2));cx=(xmin+xmax)/2;cy=(ymin+ymax)/2;zoom=Math.min(c.clientWidth/(xmax-xmin+160),c.clientHeight/(ymax-ymin+160));following=false}
async function step(frames){if(loading||busy||!session)return;busy=true;try{let drive=touch||((keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0));state=await api('step',{session,frames,drive});if(state.won)pause()}catch(e){pause();$('error').textContent=e.message}finally{busy=false}}
function sprite(o){let f=atlas[o.frame];if(!$('textures').checked||!f||!img.complete||!img.naturalWidth)return false;let [x,y,w,h]=f.frame.match(/-?\d+/g).map(Number),[sx,sy,sw,sh]=f.sourceColorRect.match(/-?\d+/g).map(Number),[fw,fh]=f.sourceSize.match(/-?\d+/g).map(Number);ctx.save();ctx.scale(o.w/fw,o.h/fh);ctx.translate(sx+sw/2-fw/2,sy+sh/2-fh/2);if(f.rotated){ctx.rotate(-Math.PI/2);ctx.drawImage(img,x,y,h,w,-sh/2,-sw/2,sh,sw)}else ctx.drawImage(img,x,y,w,h,-sw/2,-sh/2,sw,sh);ctx.restore();return true}
function draw(t){let dt=last?Math.min((t-last)/1000,.1):0;last=t;if(playing){acc=Math.min(.2,acc+dt);let n=Math.min(12,Math.floor(acc*60));if(n&&!busy&&!loading){acc-=n/60;step(n)}}let w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#f7f2e5';ctx.fillRect(0,0,w,h);if(state){if(following){let v=state.objects.find(o=>o.kind==='car');cx=v.x;cy=v.y}ctx.save();ctx.translate(w/2,h/2);ctx.scale(zoom,zoom);ctx.translate(-cx,-cy);ctx.strokeStyle='#e8e1d0';ctx.lineWidth=1/zoom;ctx.beginPath();for(let x=Math.floor((cx-w/zoom/2)/200)*200;x<cx+w/zoom/2;x+=200){ctx.moveTo(x,cy-h/zoom/2);ctx.lineTo(x,cy+h/zoom/2)}for(let y=Math.floor((cy-h/zoom/2)/200)*200;y<cy+h/zoom/2;y+=200){ctx.moveTo(cx-w/zoom/2,y);ctx.lineTo(cx+w/zoom/2,y)}ctx.stroke();for(let o of state.objects){ctx.save();ctx.globalAlpha=o.alpha??1;ctx.translate(o.x,o.y);ctx.rotate(o.angle);if(o.kind==='label'){ctx.fillStyle='#344a3c';ctx.font='20px system-ui';ctx.textAlign='center';let a=o.text.replaceAll('\\n','\n').split('\n');a.forEach((s,i)=>ctx.fillText(s,0,i*25));ctx.restore();continue}if(!sprite(o)){ctx.fillStyle=o.kind==='ball'?'#d96446':o.kind==='star'?'#dfb12f':o.kind==='switch'?'#29a37e':o.kind==='car'||o.kind==='wheel'?'#6085a0':o.dynamic?'#ae7951':'#576558';if(o.tint)ctx.fillStyle='rgb('+o.tint.map(x=>Math.round(x*255)).join(',')+')';ctx.strokeStyle='#35473a';ctx.lineWidth=1.3/zoom;ctx.beginPath();if(o.circle||o.kind==='ball'||o.kind==='wheel')ctx.arc(0,0,o.w/2,0,Math.PI*2);else if(o.kind==='star'){for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,r=i%2?11:25;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath()}else ctx.rect(-o.w/2,-o.h/2,o.w,o.h);ctx.fill();ctx.stroke()}else if(o.tint){ctx.globalAlpha=.2;ctx.fillStyle='rgb('+o.tint.map(x=>Math.round(x*255)).join(',')+')';ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h)}ctx.restore()}ctx.restore();$('hud').textContent=(state.won?'货球已到达目标 ✓':playing?'试玩中':'已暂停')+' · '+state.time.toFixed(1)+' s · '+Math.round(zoom*100)+'%';$('warnings').textContent=state.warnings.join('；')}requestAnimationFrame(draw)}
$('play').onclick=()=>{if(loading||!session)return;playing=!playing;acc=0;$('play').textContent=playing?'暂停':'继续试玩';c.focus()};$('reset').onclick=load;$('single').onclick=()=>{pause();step(1)};$('fit').onclick=fit;$('follow').onclick=()=>{following=true;zoom=.8};$('level').onchange=load;for(let [id,delta] of [['prev',-1],['next',1]])$(id).onclick=()=>{let n=+$('level').value+delta;if(n>=1&&n<=60){$('level').value=n;load()}};
window.onkeydown=e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;let k=e.key.startsWith('Arrow')?e.key:e.key.toLowerCase();if(['ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();if(k===' '&&!e.repeat)$('play').click();if(k==='r'&&!e.repeat)load();keys.add(k)};window.onkeyup=e=>keys.delete(e.key.startsWith('Arrow')?e.key:e.key.toLowerCase());window.onblur=pause;document.onvisibilitychange=()=>{if(document.hidden)pause()};
for(let [id,v] of [['left',-1],['right',1]]){$(id).onpointerdown=e=>{touch=v;e.target.setPointerCapture(e.pointerId)};$(id).onpointerup=$(id).onpointercancel=()=>touch=0}
c.onwheel=e=>{e.preventDefault();zoom=Math.max(.03,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));following=false};c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,cx,cy};following=false;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){cx=drag.cx-(e.clientX-drag.x)/zoom;cy=drag.cy-(e.clientY-drag.y)/zoom}};c.onpointerup=c.onpointercancel=()=>drag=null;
(async()=>{try{[catalog,atlas]=await Promise.all([api('levels'),api('atlas')]);for(let name of ['原版','扩展']){let g=document.createElement('optgroup');g.label=name==='原版'?'原版 1～45':'扩展 46～60';for(let d of catalog.filter(x=>x.group===name)){let o=document.createElement('option');o.value=d.level;o.textContent=d.level+' · '+d.title;g.append(o)}$('level').append(g)}await load()}catch(e){$('error').textContent=e.message}})();requestAnimationFrame(draw);
</script></html>
